{% load static %}
<header class="header">
  <div class="header__top">
    <div class="header__container container">
      <div class="header__contact">
        <span>(+01) - 2345 - 6789</span>
        <span>Our location</span>
      </div>
      <p class="header__alert-news">
        Super Values Deals - Save more coupons
      </p>
      <a href="login-register.html" class="header__top-action">
        Log In / Sign Up
      </a>
    </div>
  </div>

  <nav class="nav container">
    <a href="{% url 'index' %}" class="nav__logo">
      <img
        class="nav__logo-img"
        src="{% static 'img/logo.svg' %}"
        alt="website logo"
      />
    </a>
    <div class="nav__menu" id="nav-menu">
      <div class="nav__menu-top">
        <a href="index.html" class="nav__menu-logo">
          <img src="{% static 'img/logo.svg' %}" alt="">
        </a>
        <div class="nav__close" id="nav-close">
          <i class="fi fi-rs-cross-small"></i>
        </div>
      </div>
      <ul class="nav__list">
        <li class="nav__item">
          <a href="{% url 'index' %}" class="nav__link active-link">Home</a>
        </li>
        <li class="nav__item">
          <a href="shop.html" class="nav__link">Shop</a>
        </li>
        <li class="nav__item">
          <a href="accounts.html" class="nav__link">My Account</a>
        </li>
        <!-- <li class="nav__item">
          <a href="compare.html" class="nav__link">Compare</a>
        </li> -->
        <li class="nav__item">
          {% if user.is_authenticated %}
          <!-- If user is authenticated, show username and dropdown -->
          <a href="{% url 'signout' %}" class="nav__link">Logout</a>
          {% else %}
          <a href="{% url 'signin' %}" class="nav__link">Sign UP / Login</a>
          {% endif %}
        </li>
      </ul>
      <div class="header__search">
        <input
          type="text"
          placeholder="Search For Items..."
          class="form__input"
        />
        <button class="search__btn">
          <img src="{% static 'img/search.png' %}" alt="search icon" />
        </button>
      </div>
    </div>
    <div class="header__user-actions">
      <a href="{% url 'profile' %}" class="header__action-btn" title="Wishlist">
        <img src="{% static 'img/icon-heart.svg' %}" alt="" />
        <span class="count">{{ user.wishlist.count }}</span>
      </a>
      <a href="{% url 'view_cart' %}" class="header__action-btn" title="Cart">
        <img src="{% static 'img/icon-cart.svg' %}" alt="" />
        <span class="count">{{ user.items_count }}</span>
      </a>
      <div class="header__action-btn nav__toggle" id="nav-toggle">
        <img src="{% static 'img/menu-burger.svg' %}" alt="">
      </div>
    </div>
  </nav>
</header>
